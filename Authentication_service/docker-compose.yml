volumes:
  userdb_vol:

networks:
  test_runner_network:
    driver: bridge

services:
  user-api:
    container_name: user-service
    build:
      context: .
    ports:
      - "5001:5001"
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - test_runner_network
    restart: always

  user-db:
    container_name: user-db
    image: mysql:8
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 2ErdHmed
      MYSQL_DATABASE: user_db
      MYSQL_USER: myuser
      MYSQL_PASSWORD: 2ErdHmed
    networks:
      - test_runner_network
    volumes:
      - userdb_vol:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
